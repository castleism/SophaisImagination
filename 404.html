<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Sophia's Imagination</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--midnight:#0c1021;--ivory:#f5efe2;--champagne:#dcbc82;--gold:#b8934d;--muted:rgba(245,239,226,.64)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--midnight);color:var(--ivory);font-family:'Inter',sans-serif;font-weight:300;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;line-height:1.7}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(2.2rem,6vw,3.4rem);font-weight:500;margin-bottom:14px}
  .k{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
  p{color:var(--muted);max-width:460px;margin:0 auto 26px}
  em{font-family:'Cormorant Garamond',Georgia,serif;color:var(--champagne)}
  a.btn{display:inline-block;padding:13px 28px;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;background:var(--champagne);color:var(--midnight);text-decoration:none;border-radius:2px}
  a.btn:hover{background:var(--ivory)}
</style>
</head>
<body>
<main>
  <p class="k">404 — Not found</p>
  <h1>An imagined page</h1>
  <p>This address belongs to a world that hasn't been designed yet. <em>Fitting, honestly — most of Sophia's places don't exist.</em> The real ones are one door away.</p>
  <a class="btn" href="/">Return to the worlds</a>
</main>
</body>
</html>
