<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1021">
  <title>Install Sophia's Imagination</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c1021;color:#f5efe2;font-family:Georgia,serif;padding:24px;text-align:center}
    a{display:inline-block;margin-top:16px;padding:12px 20px;background:#dcbc82;color:#0c1021;text-decoration:none;border-radius:4px}

  </style>
</head>
<body>
  <main>
    <h1>Sophia's Imagination</h1>

    <a href="/">Open the site</a>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js');
    }
  </script>
